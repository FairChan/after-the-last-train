<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Underdog</title>
<link rel="icon" href="data:,">
<style>
  /* 主色：蓝（未来感，用户要求）。--amber / --orange / --cream 名字没改，值是蓝、深蓝、冰白；金币、品质色、门禁卡黄不变 */
  :root { --ink: #0b0a14; --paper: #eef3ff; --dim: #8a90b0; --red: #ff3047; --orange: #2f7dff; --amber: #4cc3ff; --cream: #d8f1ff; --cyan: #3ee8ff; --gold: #e3c14a; --green: #8dff6a;
    --f: PixelZH, "Microsoft YaHei UI", "Microsoft YaHei", sans-serif; --f10: PixelZH10, PixelZH, "Microsoft YaHei UI", sans-serif; } /* 像素字体：12px 正文 / 10px 小字（font-art.js） */
  html, body { margin: 0; height: 100%; background: #040309; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; font-family: var(--f); color: var(--paper); user-select: none; }
  /* 禁用浏览器手势（gestures.js）：两指滑动不前进后退、不回弹，触屏不缩放不长按弹菜单，图片拖不出来 */
  html, body { overscroll-behavior: none; touch-action: none; -webkit-touch-callout: none; }
  img { -webkit-user-drag: none; user-drag: none; }
  #stage { position: relative; flex: none; width: 640px; height: 360px; --s: 1; transform-origin: 50% 50%; } /* 界面按 640×360 排，整体按整数倍放大（main.js resize） */
  #game { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; display: block; }
  #ui { position: absolute; inset: 0; pointer-events: none; font-size: 12px; font-family: var(--f); }
  #ui * { box-sizing: border-box; }
  #ui button, #ui input, #ui .click, #ui .slot, #ui .side, #ui .lootp, #ui .topbar, #ui .stash, #ui .loadout, #ui .raidbar, #ui .over-wrap > * { pointer-events: auto; }
  #ui img { image-rendering: pixelated; display: block; }
  .btn, .side, .lootp, .topbar, .tip, .toast, .stash, .loadout, .raidbar, .item, .slot { box-shadow: 0 0 0 1px var(--ink), 0 0 0 3px #2f3550, 0 5px 0 1px rgba(0,0,0,.6); }
  .btn { font: 400 12px var(--f); color: var(--paper); background: linear-gradient(#2f3550, #1d2033); border: 0; padding: 5px 13px; cursor: pointer; letter-spacing: 0; }
  .btn:hover { background: linear-gradient(#4a5374, #2f3550); }
  .btn.sm { font-size: 12px; font-family: var(--f); padding: 3px 8px; }
  .btn.primary { background: linear-gradient(#3a8cff, #1a4ac2); color: #fff; text-shadow: 0 1px 0 #051a5a; box-shadow: 0 0 0 1px var(--ink), 0 0 0 3px #4cc3ff; }
  .btn.primary:hover { background: linear-gradient(#4cc3ff, #225ae0); }
  .btn.poor { opacity: .45; }
  .hint { font-size: 12px; font-family: var(--f); color: var(--dim); line-height: 1.5; }
  .hint.warn { color: #ff9a7a; }
  .bf-diff { display: flex; align-items: center; gap: 4px; margin: 2px 0 5px; } .bf-diff > span { font-size: 12px; font-family: var(--f); color: var(--dim); white-space: nowrap; }
  .bf-diff .btn { flex: 1; white-space: nowrap; padding: 1px 3px; } .bf-diff .btn.on { box-shadow: 0 0 0 1px var(--ink), 0 0 0 3px var(--dc); color: var(--dc); }
  .rb-diff { font-weight: 400; letter-spacing: 0; }
  /* 精简界面 */
  .lite .mod.use.none { display: none; }
  .lite .banner { height: 43px; } .lite .banner b { font-size: 20px; font-family: var(--f10); }
  /* 改键 */
  .modal.settings .mbox { max-height: 94%; overflow-y: auto; }
  .bind-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 2px 7px; }
  .bind { display: flex; align-items: center; justify-content: space-between; gap: 3px; font-size: 12px; font-family: var(--f); color: #c8cfe8; }
  .bind .btn { min-width: 33px; padding: 1px 5px; } .bind .btn.changed { color: var(--amber); } .bind .btn.wait { color: #3ee8ff; }
  /* 涂装 */
  .stash.hangar { display: flex; flex-direction: column; } .hangar .sh-grid { flex: 1; min-height: 0; overflow-y: auto; } .hangar .skins { flex: none; }
  .skins { margin-top: 8px; } .skins h4 { margin: 0 0 5px; }
  .sk-row { display: flex; gap: 5px; flex-wrap: wrap; }
  .sk { pointer-events: auto; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 1px; background: #161827; border: 0; color: #c8cfe8; font: 400 12px var(--f); padding: 3px 5px; box-shadow: 0 0 0 1px var(--ink), 0 0 0 3px #2f3550; }
  .sk i { width: 23px; height: 17px; border-bottom: 4px solid; display: block; }
  .sk b { color: var(--gold); font-size: 12px; font-family: var(--f); } .sk.lock { opacity: .7; } .sk.on { box-shadow: 0 0 0 1px var(--ink), 0 0 0 3px var(--amber); color: var(--cream); }
  /* 标题页：简约、沉浸。背后的活车站铺满（main.js 画），上下电影黑边 + 暗角；左下一组字和纯文字菜单；先从黑里淡出来 */
  .ti { position: absolute; inset: 0; overflow: hidden; }
  .ti-vig { position: absolute; inset: 0; background: radial-gradient(ellipse 80% 75% at 64% 46%, rgba(4,3,10,0) 45%, rgba(4,3,10,.5) 78%, rgba(4,3,10,.88) 100%); }
  .ti-bar { position: absolute; left: 0; right: 0; height: 24px; background: #050409; }
  .ti-bar.top { top: 0; } .ti-bar.bot { bottom: 0; }
  .ti-fade { position: absolute; inset: 0; background: #050409; pointer-events: none; animation: tiFade 1.8s ease-out .2s both; }
  @keyframes tiFade { to { opacity: 0; visibility: hidden; } }
  .ti-main { position: absolute; left: 40px; bottom: 42px; width: 300px; display: flex; flex-direction: column; align-items: flex-start; }
  .ti-main > * { animation: tiUp .8s ease-out both; }
  @keyframes tiUp { from { opacity: 0; transform: translateY(6px); } }
  .ti-logo { font: 400 48px var(--f); color: var(--cream); line-height: 1; margin: 0 0 14px; letter-spacing: 2px; text-shadow: 0 3px 0 #08142a, 0 0 18px rgba(60,140,255,.35); animation-delay: 1s; }
  .ti-menu { display: flex; flex-direction: column; align-items: flex-start; gap: 1px; margin-top: 15px; animation-delay: 1.4s; }
  #ui .ti-it { all: unset; pointer-events: auto; cursor: pointer; display: flex; align-items: baseline; gap: 7px; padding: 1px 0; color: #676d8e; transition: color .15s, transform .15s; }
  #ui .ti-it .ti-mk { width: 10px; font: 400 12px var(--f); color: var(--amber); opacity: 0; }
  #ui .ti-it .ti-zh { font: 400 20px var(--f10); line-height: 1.25; }
  #ui .ti-it small { font: 400 10px var(--f10); color: var(--amber); opacity: 0; transition: opacity .15s; }
  #ui .ti-it.sel { color: var(--cream); transform: translateX(4px); }
  #ui .ti-it.sel .ti-mk { opacity: 1; animation: tiNudge 1s steps(2, end) infinite; }
  #ui .ti-it.sel small { opacity: .9; } #ui .ti-it.primary:not(.sel) small { opacity: .5; }
  @keyframes tiNudge { 50% { transform: translateX(2px); } }
  .ti-foot { position: absolute; left: 40px; right: 40px; bottom: 0; height: 24px; display: flex; align-items: center; justify-content: space-between; font: 400 10px var(--f10); color: #565b78; }
  .ti-foot .seedrow { display: flex; align-items: center; gap: 5px; font: 400 10px var(--f10); color: #565b78; }
  .ti-foot .seedrow input { width: 64px; font: 400 10px var(--f10); background: transparent; border: 0; border-bottom: 1px solid #2f3550; color: var(--amber); text-align: left; padding: 0 1px; }
  .ti-foot .seedrow input:focus { border-bottom-color: var(--amber); }
  /* 开始页退场（进首页前在原地播完，ui-menu.js 的 leave）：菜单一条条往左收，标题故障一下，电影黑边往外收，暗角散掉 */
  #ui .ti-out .ti-it { animation: tiOutL .3s cubic-bezier(.5, 0, .8, .4) both; } /* #ui 前缀：.ti-it 的 all: unset 在 #ui 下，要压过它 */
  #ui .ti-out .ti-it:nth-child(2) { animation-delay: .05s; } #ui .ti-out .ti-it:nth-child(3) { animation-delay: .1s; } #ui .ti-out .ti-it:nth-child(4) { animation-delay: .15s; }
  .ti-out .ti-logo { animation: tiGlitch .42s steps(7, end) both; }
  .ti-out .ti-foot { animation: tiFadeOut .25s ease-in both; }
  .ti-out .ti-bar.top { animation: tiBarUp .5s cubic-bezier(.7, 0, .8, .4) .12s both; }
  .ti-out .ti-bar.bot { animation: tiBarDn .5s cubic-bezier(.7, 0, .8, .4) .12s both; }
  .ti-out .ti-vig { animation: tiFadeOut .6s ease-in both; }
  @keyframes tiOutL { to { opacity: 0; transform: translateX(-30px); } }
  @keyframes tiGlitch { 15% { transform: translateX(-6px); text-shadow: 3px 0 #ff4d5e, -3px 0 #3ee8ff, 0 3px 0 #08142a; } 30% { transform: translateX(5px); clip-path: inset(20% 0 45% 0); } 45% { transform: translateX(-3px); clip-path: inset(60% 0 5% 0); } 60% { transform: none; clip-path: none; opacity: .6; } 75% { opacity: .9; transform: translateX(-14px); } 100% { opacity: 0; transform: translateX(-40px); } }
  @keyframes tiFadeOut { to { opacity: 0; } }
  @keyframes tiBarUp { to { transform: translateY(-100%); } }
  @keyframes tiBarDn { to { transform: translateY(100%); } }
  #ui .ti-link { all: unset; pointer-events: auto; cursor: pointer; font: 400 10px var(--f10); color: #8a90b0; } #ui .ti-link:hover { color: var(--cream); }
  .mod.use.cd img { opacity: .35; filter: grayscale(1); }
  /* 问号站事件 */
  #ui .evp.side { position: absolute; left: 50%; top: 50%; right: auto; bottom: auto; transform: translate(-50%, -50%); display: block; width: 317px; padding: 13px 17px; background: linear-gradient(#171826f2, #0d0e18f2); }

  .side { position: absolute; right: 7px; top: 40px; bottom: 7px; width: 180px; background: linear-gradient(rgba(20,22,36,.95), rgba(10,10,18,.95)); padding: 8px; display: flex; flex-direction: column; gap: 7px; overflow: hidden; }

  /* 站里和人说话（talk-bubble.js）：头顶气泡 + 下方选项条画在画布上，站内界面先收起来，别挡住选项和旁白 */
  #ui.talking > :not(.panel-slot):not(.toast):not(.modal) { opacity: 0; pointer-events: none; transition: opacity .15s; }
  /* 仓库页的子弹袋（ui-hub.js）：袋子空了写"空 · 点开买弹药"，单击弹出交易行（ui-slotshop.js）；有弹药时单击空的格子也一样 */
  .pouchbox { position: relative; width: max-content; max-width: 100%; }

  .pouchbox .pb-empty { position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-50%); text-align: center; font: 400 10px var(--f10); color: #7a80a6; text-shadow: 0 0 3px #0b0c16; white-space: nowrap; pointer-events: none; }
  /* ── 站内右上顶栏 + 界面透明度 / 大小（hud-tune.js）：站牌并到顶栏左边一行；不再显示背包格数；钱前面一个货币图标。
     --hud-a 不透明度、--hud-s 大小（设置 → 画面），各块按自己贴着的角缩放 */
  .m-station .tophud { position: absolute; right: 7px; top: 7px; display: flex; align-items: center; gap: 6px; z-index: 4; pointer-events: none; transform-origin: 100% 0; transform: scale(var(--hud-s, 1)); opacity: var(--hud-a, .8); }
  .m-station .tophud .raidbar { position: relative; left: auto; right: auto; top: auto; gap: 7px; padding: 0 6px; background: rgba(14,15,26,.55); }
  .m-station .tophud .sched { position: relative; right: auto; top: auto; width: auto; gap: 8px; background: rgba(14,15,26,.55); }
  .m-station .tophud .rb-alert .tbar { width: 30px; }
  .rb-bag { display: inline-flex; align-items: center; } .rb-bag .ico-gold { margin-right: 3px; vertical-align: 0; }
  .m-station .mods { transform-origin: 100% 100%; transform: scale(var(--hud-s, 1)); opacity: var(--hud-a, .8); }
  .m-station .ammo { transform-origin: 0 100%; transform: scale(var(--hud-s, 1)); opacity: var(--hud-a, .8); }
  /* ── 威胁特效（threat-fx.js）：升级时数字砸下、进度条白闪、外扩一圈框、下面弹小牌、屏幕四边暗光；跨档更重；常驻的按档加 */
  .tophud .rb-alert b { display: inline-block; }
  .tophud.lvup .rb-alert b { animation: tfxSlam .5s steps(6, end); }
  .tophud.lvup .rb-alert .tbar { animation: tfxBar .7s steps(4, end); }
  .tophud.lvbig .raidbar { animation: tfxJolt .45s steps(5, end); }
  @keyframes tfxSlam { 0% { transform: scale(2.6) translateY(-3px); color: #fff; } 45% { transform: scale(.85); color: #fff; } 100% { transform: none; } }
  @keyframes tfxBar { 0%, 50% { background: #fff; } 100% { background: #2a2030; } }
  @keyframes tfxJolt { 0% { transform: translateX(-4px); } 25% { transform: translateX(4px); } 50% { transform: translateX(-2px); } 75% { transform: translateX(2px); } 100% { transform: none; } }
  .tfx-ring { position: absolute; top: 0; height: 22px; pointer-events: none; box-shadow: 0 0 0 1px var(--tc); animation: tfxRing .8s steps(8, end) forwards; }
  @keyframes tfxRing { 0% { box-shadow: 0 0 0 1px #fff, 0 0 0 2px var(--tc); opacity: 1; } 100% { box-shadow: 0 0 0 1px transparent, 0 0 0 12px var(--tc); opacity: 0; } }
  .tfx-pop { position: absolute; right: 124px; top: 30px; display: flex; align-items: center; gap: 5px; padding: 2px 7px 2px 5px; background: rgba(14,10,18,.85); box-shadow: 0 0 0 1px var(--ink), inset 2px 0 0 var(--tc), 0 3px 0 1px rgba(0,0,0,.5); color: var(--tc); white-space: nowrap; animation: tfxPop 2.3s steps(23, end) forwards; }
  .tfx-pop small { font: 400 10px var(--f10); color: #c9b8c8; } .tfx-pop b { font: 400 12px var(--f); color: #fff; } .tfx-pop span { font: 400 12px var(--f); }
  .tfx-pop.big { padding: 3px 9px 3px 6px; box-shadow: 0 0 0 1px var(--ink), 0 0 0 2px var(--tc), 0 3px 0 2px rgba(0,0,0,.5); animation: tfxPop 3s steps(30, end) forwards; }
  .tfx-pop.big small { color: var(--tc); } .tfx-pop.big span { animation: tfxGlitch .6s steps(6, end) 2; }
  @keyframes tfxPop { 0% { transform: translateY(-8px); opacity: 0; } 8% { transform: none; opacity: 1; } 80% { opacity: 1; } 100% { opacity: 0; transform: translateY(2px); } }
  @keyframes tfxGlitch { 0% { text-shadow: 2px 0 #ff4d5e, -2px 0 #3ee8ff; transform: translateX(-2px); } 33% { text-shadow: -2px 0 #ff4d5e, 2px 0 #3ee8ff; transform: translateX(2px); } 66% { text-shadow: 1px 0 #fff; transform: none; } 100% { text-shadow: none; } }
  .tfx-edge { position: absolute; inset: 0; pointer-events: none; z-index: 3; box-shadow: inset 0 0 32px 4px var(--tc); opacity: 0; animation: tfxEdge 1s steps(10, end) forwards; }
  .tfx-edge.big { box-shadow: inset 0 0 48px 6px var(--tc); animation-duration: 1.5s; animation-timing-function: steps(15, end); }
  @keyframes tfxEdge { 0% { opacity: 0; } 15% { opacity: .55; } 30% { opacity: .2; } 45% { opacity: .45; } 100% { opacity: 0; } }
  .tophud:not(.calm)[data-tt=mid] .rb-alert .tbar i, .tophud:not(.calm)[data-tt=high] .rb-alert .tbar i, .tophud:not(.calm)[data-tt=max] .rb-alert .tbar i { background-image: linear-gradient(90deg, transparent 0 40%, rgba(255,255,255,.55) 50%, transparent 60% 100%); background-size: 200% 100%; animation: tfxSweep 2.4s steps(16, end) infinite; }
  @keyframes tfxSweep { 0% { background-position: 150% 0; } 100% { background-position: -50% 0; } }
  .tophud:not(.calm)[data-tt=high] .rb-alert b, .tophud:not(.calm)[data-tt=max] .rb-alert b { animation: tfxBeat 1.4s steps(1, end) infinite; }
  .tophud.lvup:not(.calm) .rb-alert b { animation: tfxSlam .5s steps(6, end); }
  @keyframes tfxBeat { 0%, 12% { transform: scale(1.3); color: #fff; } 13%, 100% { transform: none; } }
  .tophud:not(.calm)[data-tt=max] .rb-alert { animation: tfxMax 3.2s steps(1, end) infinite; }
  @keyframes tfxMax { 0%, 90% { text-shadow: none; transform: none; } 91% { text-shadow: 2px 0 #ff4d5e, -2px 0 #3ee8ff; transform: translateX(-1px); } 94% { text-shadow: -1px 0 #ff4d5e, 1px 0 #3ee8ff; transform: translateX(1px); } 97% { text-shadow: none; transform: none; } }
  /* 联机大厅（ui-lobby.js） */
  .modal.lobby .mbox { min-width: 300px; max-width: 400px; }
  .mp-f { display: flex; align-items: center; gap: 8px; } .mp-f label, .mp-r label { color: var(--dim); font-size: 12px; min-width: 28px; }

  .mp-r { display: flex; align-items: center; gap: 6px; } .mp-r #mpCode { flex: 0 0 64px; text-transform: uppercase; letter-spacing: 2px; } .mp-or { color: var(--dim); font-size: 12px; }
  .mp-err { color: #ff6a6a; font-size: 12px; } .mp-wait { color: var(--amber); }
  .mp-code { color: var(--amber); letter-spacing: 3px; margin-left: 6px; }

  .mp-row { display: grid; grid-template-columns: 1.4fr 1fr 1fr 1fr .8fr; gap: 6px; font-size: 12px; padding: 3px 6px; background: rgba(30,34,56,.6); color: var(--cream); }

  .cp-item.on b::before { content: "▶ "; }
  .cp-item.lock { opacity: .45; cursor: default; }
  .cp-here { position: absolute; right: 6px; top: 4px; font-style: normal; color: #8dff6a; }
  .cpick.going .cp-side, .cpick.going .cp-head { opacity: 0; }
